<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Secular+One&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: phone-first app shell. Sticky header, one view at a time, bottom tab bar.
   Colour system = competition plates: A1 red (25), B1 blue (20), A2 yellow (15), B2 green (10).
   Effort is a heat scale: green (easy) to red (failure). */
:root{
  --bg:#EEF0EC; --surface:#FFFFFF; --sunk:#E4E7E2; --fg:#16191D; --muted:#5D646C; --line:#D5D9D3;
  --red:#C9302A; --blue:#1F5FB0; --yellow:#E2A600; --green:#2B8A55; --steel:#5B6B7C;
  --on-red:#fff; --on-blue:#fff; --on-yellow:#1C1A10; --on-green:#fff; --on-steel:#fff;
  --heat1:#2B8A55; --heat2:#7FA82E; --heat3:#E2A600; --heat4:#E0731F; --heat5:#C9302A;
  --ok:#2B8A55; --warn:#B4610E; --focus:#1F5FB0; --ink:#16191D; --paper:#fff;
  --f-display:"Secular One","Assistant",system-ui,sans-serif;
  --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101215; --surface:#191C20; --sunk:#22262B; --fg:#ECEEEA; --muted:#9CA3AB; --line:#2C3137;
  --red:#E5554E; --blue:#4D8DE3; --yellow:#F0C232; --green:#4AB57C; --steel:#8496A9;
  --on-red:#fff; --on-blue:#08111F; --on-yellow:#1C1A10; --on-green:#07140C; --on-steel:#0B1016;
  --heat1:#4AB57C; --heat2:#A2C64A; --heat3:#F0C232; --heat4:#F08C3C; --heat5:#E5554E;
  --ok:#4AB57C; --warn:#F09A4A; --focus:#86B6F2; --ink:#ECEEEA; --paper:#191C20; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101215; --surface:#191C20; --sunk:#22262B; --fg:#ECEEEA; --muted:#9CA3AB; --line:#2C3137;
  --red:#E5554E; --blue:#4D8DE3; --yellow:#F0C232; --green:#4AB57C; --steel:#8496A9;
  --on-red:#fff; --on-blue:#08111F; --on-yellow:#1C1A10; --on-green:#07140C; --on-steel:#0B1016;
  --heat1:#4AB57C; --heat2:#A2C64A; --heat3:#F0C232; --heat4:#F08C3C; --heat5:#E5554E;
  --ok:#4AB57C; --warn:#F09A4A; --focus:#86B6F2; --ink:#ECEEEA; --paper:#191C20; color-scheme:dark}

html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* per-kind colour variables */
.t-A1{--k:var(--red);--on-k:var(--on-red)} .t-B1{--k:var(--blue);--on-k:var(--on-blue)}
.t-A2{--k:var(--yellow);--on-k:var(--on-yellow)} .t-B2{--k:var(--green);--on-k:var(--on-green)}
.t-football,.t-run{--k:var(--steel);--on-k:var(--on-steel)}
.fill{background:var(--k);color:var(--on-k)}
.tint{background:color-mix(in srgb,var(--k) 12%,var(--surface))}

#app{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(150px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 0}
.top .row1{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:10px}
.stripe{display:grid;grid-template-columns:4fr 3fr 2fr 1fr;height:5px;border-radius:3px;overflow:hidden}
.stripe i:nth-child(1){background:var(--red)}.stripe i:nth-child(2){background:var(--blue)}.stripe i:nth-child(3){background:var(--yellow)}.stripe i:nth-child(4){background:var(--green)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.plates{display:flex;gap:3px;align-items:center}
.plates i{display:block;width:7px;border-radius:2px}
.plates i:nth-child(1){height:26px;background:var(--red)}
.plates i:nth-child(2){height:22px;background:var(--blue)}
.plates i:nth-child(3){height:18px;background:var(--yellow)}
.plates i:nth-child(4){height:14px;background:var(--green)}
.brand h1{font-family:var(--f-display);font-size:1.55rem;font-weight:400;margin:0;line-height:1;letter-spacing:.01em}
.brand .logo{width:42px;height:42px;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.18))}
.wm-a{color:var(--fg)} .wm-b{color:var(--red)}
@media (prefers-reduced-motion:no-preference){.brand .logo{animation:flap 3.2s ease-in-out infinite;transform-origin:50% 60%}@keyframes flap{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}}
#status{font-size:.78rem;color:var(--muted);white-space:nowrap;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
#status.bad{color:var(--warn);border-color:var(--warn)}

main{padding-top:16px;display:grid;gap:16px}
section{display:grid;gap:16px;min-width:0}
h2{font-family:var(--f-display);font-weight:400;font-size:1.55rem;margin:0;line-height:1.2;text-wrap:balance}
h3{font-size:1.05rem;margin:0;font-weight:800}
.eyebrow{font-size:.75rem;letter-spacing:.06em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.card h3{display:flex;align-items:center;gap:8px}
.card h3 .ic{width:10px;height:10px;border-radius:3px;background:var(--k,var(--blue))}

.chip{display:inline-flex;align-items:center;justify-content:center;gap:4px;border-radius:999px;padding:2px 10px;font-weight:800;font-size:.85rem;line-height:1.6;border:0}

/* block progress (heat scale) */
.block{display:grid;gap:8px;border-radius:var(--r);padding:12px 14px;background:color-mix(in srgb,var(--h) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--h) 40%,var(--line))}
.block .meta{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:.92rem}
.block b{font-family:var(--f-mono);font-weight:700}
.segs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.segs i{height:6px;border-radius:3px;background:var(--line)}
.segs i.on{background:var(--h)}
.segs i.cur{outline:2px solid var(--fg);outline-offset:1px}
.h1{--h:var(--heat1)}.h2{--h:var(--heat2)}.h3{--h:var(--heat3)}.h4{--h:var(--heat4)}.h5{--h:var(--heat5)}.hd{--h:var(--steel)}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 0 8px;display:grid;justify-items:center;gap:3px;min-width:0}
.wd .n{font-family:var(--f-mono);font-weight:700;font-size:.95rem}
.wd .l{font-size:.72rem;color:var(--muted)}
.wd .dot{width:24px;height:6px;border-radius:3px;background:transparent}
.wd .dot.fill{background:var(--k)}
.wd.sel{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.wd.sel.has{background:var(--k);color:var(--on-k);border-color:var(--k);box-shadow:none}
.wd.sel.has .l{color:inherit;opacity:.85}
.wd.sel.has .dot.fill{background:var(--on-k)}
.wd.today .n{text-decoration:underline;text-underline-offset:3px}
.wd .ck{font-size:.7rem;line-height:1;height:.7rem;color:var(--ok);font-weight:800}
.wd.sel.has .ck{color:inherit}

.dayhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dayhead .mid{text-align:center;min-width:0}
.nav-btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:700;white-space:nowrap}

/* workout card */
.wo{border-radius:var(--r);overflow:hidden;border:1px solid color-mix(in srgb,var(--k) 45%,var(--line));background:var(--surface)}
.wo-band{display:flex;align-items:center;gap:14px;padding:16px;background:var(--k);color:var(--on-k)}
.wo-code{font-family:var(--f-display);font-size:2.4rem;line-height:1;min-width:64px;text-align:center;background:color-mix(in srgb,var(--on-k) 16%,transparent);border-radius:12px;padding:8px 10px}
.wo-band .t{min-width:0;flex:1}
.wo-band h2{color:inherit}
.wo-band .sub{opacity:.9;font-size:.95rem}
.wo-body{padding:4px 16px 16px;display:grid;gap:12px}
.done-btn{border:2px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:8px 16px;font-weight:800;white-space:nowrap}
.done-btn.on{background:var(--on-k);color:var(--k);border-color:var(--on-k)}
.card .done-btn{color:var(--ok)}
.card .done-btn.on{background:var(--ok);color:var(--paper);border-color:var(--ok)}
.note-deload{background:color-mix(in srgb,var(--steel) 16%,var(--surface));border-radius:10px;padding:10px 12px;font-size:.92rem;margin-top:12px}
.gc-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.gc-line input[type=time]{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-family:var(--f-mono)}

ol.exs{list-style:none;margin:0;padding:0;display:grid}
.ex{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.ex-num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:.85rem;background:color-mix(in srgb,var(--k) 18%,var(--surface));color:var(--fg);border:2px solid var(--k)}
.ex.has-log .ex-num{background:var(--k);color:var(--on-k)}
.ex-body{display:grid;gap:7px;min-width:0}
.ex-name{font-weight:700;line-height:1.35}
.ex-rx{font-size:.9rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 10px;font-weight:700;font-size:.85rem;border:1px solid var(--line);background:var(--sunk);color:var(--fg)}
.pill.sets{font-family:var(--f-mono);background:color-mix(in srgb,var(--k) 14%,var(--surface));border-color:color-mix(in srgb,var(--k) 45%,var(--line))}
.pill.rir{background:color-mix(in srgb,var(--h) 18%,var(--surface));border-color:color-mix(in srgb,var(--h) 55%,var(--line))}
.pill.rir .mono{font-weight:700}
.rest-btn{border:1px solid color-mix(in srgb,var(--blue) 45%,var(--line));background:color-mix(in srgb,var(--blue) 12%,var(--surface));border-radius:999px;padding:1px 10px;font-size:.85rem;font-weight:700}
.tag{font-size:.75rem;font-weight:800;border:1px dashed var(--muted);border-radius:6px;padding:0 6px;color:var(--muted)}
.tip{font-size:.85rem;color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--surface));border-radius:8px;padding:4px 8px}
.ex-log{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:8px}
.ex-log label{display:grid;gap:2px;font-size:.75rem;color:var(--muted);font-weight:700}
.ex-log input,textarea{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:var(--f-mono);font-size:1rem;min-width:0}
.ex-log input:focus,textarea:focus{border-color:var(--k,var(--blue));outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--k,var(--blue)) 25%,transparent)}
textarea{font-family:var(--f-body);resize:vertical;min-height:70px}
.ex-prev{font-size:.82rem;color:var(--muted)}
.ex-prev .mono{color:var(--fg);font-weight:700}

.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{border-radius:10px;padding:10px 14px;font-weight:800;border:1px solid var(--line);background:var(--surface);min-width:64px}
.pick button.fill{border-color:transparent}
.pick button.cur{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--fg)}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{text-align:center;font-size:.75rem;color:var(--muted);font-weight:700;padding-bottom:2px}
.cell{aspect-ratio:1/1.15;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:2px;min-width:0;overflow:hidden}
.cell.out{visibility:hidden}
.cell.has{background:color-mix(in srgb,var(--k) 14%,var(--surface));border-color:color-mix(in srgb,var(--k) 40%,var(--line))}
.cell.has.done{background:var(--k);color:var(--on-k);border-color:var(--k)}
.cell .n{font-family:var(--f-mono);font-size:.82rem;font-weight:700;align-self:flex-start}
.cell.today{box-shadow:inset 0 0 0 2px var(--fg)}
.cell.deload:not(.has){background:repeating-linear-gradient(135deg,var(--surface) 0 6px,var(--sunk) 6px 8px)}
.cell.deload .n::after{content:" ·D";color:var(--muted);font-size:.65rem}
.cell.past:not(.today):not(.has) .n{color:var(--muted)}
.cell .c{font-size:.72rem;font-weight:800;border-radius:6px;padding:1px 4px;width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--k);color:var(--on-k)}
.cell.done .c{background:var(--on-k);color:var(--k)}
.cell .c.done::before{content:"✓ "}
.cell .c.missed{opacity:.5}
.cell .gc{width:5px;height:5px;border-radius:50%;background:var(--blue);align-self:flex-end;margin-top:-4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.82rem;color:var(--muted);align-items:center}
.legend .sw{display:inline-block;width:14px;height:10px;border-radius:3px;vertical-align:middle;margin-inline-end:4px;background:var(--k)}
.sw.dl{background:repeating-linear-gradient(135deg,var(--surface) 0 3px,var(--muted) 3px 4px)!important;border:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{border-radius:12px;padding:12px;background:color-mix(in srgb,var(--k) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--k) 35%,var(--line))}
.stat b{font-family:var(--f-mono);font-size:1.5rem;display:block;line-height:1.1}
.stat span{font-size:.8rem;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:700}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.gcal{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn[disabled]{opacity:.55;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.settings-grid label{display:grid;gap:4px;font-size:.78rem;color:var(--muted);font-weight:700}
.settings-grid input,.settings-grid select{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:var(--f-mono);min-width:0;width:100%}
.check{display:flex!important;align-items:center;gap:8px;grid-template-columns:none}
.gc-msg{font-size:.88rem;border-radius:10px;padding:8px 12px;background:var(--sunk)}
.gc-msg.err{background:color-mix(in srgb,var(--warn) 14%,var(--surface));color:var(--fg)}
.gc-msg.ok{background:color-mix(in srgb,var(--ok) 14%,var(--surface))}

/* per-set logging */
.sets{display:grid;gap:6px}
.set-h,.set{display:grid;grid-template-columns:26px minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr) 44px;gap:6px;align-items:center}
.set-h{font-size:.72rem;color:var(--muted);font-weight:700;text-align:center}
.set .si{font-family:var(--f-mono);font-weight:700;color:var(--muted);text-align:center}
.set .pv{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set input{width:100%;min-width:0;text-align:center;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 4px;font-family:var(--f-mono);font-size:1rem}
.set input:focus{border-color:var(--k);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--k) 25%,transparent)}
.set .ck{height:38px;border-radius:9px;border:2px solid var(--line);background:var(--surface);font-weight:800;color:var(--muted)}
.set.done input{background:color-mix(in srgb,var(--ok) 14%,var(--surface));border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.set.done .ck{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.set.pr .si::after{content:"★";color:var(--yellow);display:block;font-size:.7rem;line-height:1}

function lineChart(pts,opt={}){

/* ---------- rest timer ---------- */
const T={end:0,total:0,iv:null,beeped:false,lock:null,ac:null};
const fmtT=s=>{const a=Math.abs(s);return (s<0?"+":"")+Math.floor(a/60)+":"+pad(a%60)};
function startTimer(restStr,name){
  const secs=Math.round(parseFloat(String(restStr).split("-")[0])*60)||90;
  T.total=secs;T.end=Date.now()+secs*1000;T.beeped=false;
  $("#t-what").textContent="מנוחה · "+name+(String(restStr).includes("-")?` (עד ${restStr.split("-")[1]} דק׳)`:"");
  $("#timer").hidden=false;$("#timer").classList.remove("over");
  try{T.ac=T.ac||new (window.AudioContext||window.webkitAudioContext)();T.ac.resume&&T.ac.resume()}catch(e){T.ac=null}
  try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(l=>T.lock=l).catch(()=>{})}catch(e){}
  clearInterval(T.iv);tick();T.iv=setInterval(tick,1000);
}
function beep(){try{if(!T.ac)return;for(const [i,f] of [[0,880],[.25,880],[.5,1175]]){const o=T.ac.createOscillator(),g=T.ac.createGain();o.frequency.value=f;g.gain.setValueAtTime(.0001,T.ac.currentTime+i);g.gain.exponentialRampToValueAtTime(.3,T.ac.currentTime+i+.02);g.gain.exponentialRampToValueAtTime(.0001,T.ac.currentTime+i+.2);o.connect(g).connect(T.ac.destination);o.start(T.ac.currentTime+i);o.stop(T.ac.currentTime+i+.22)}}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function tick(){
  const left=Math.round((T.end-Date.now())/1000);
  $("#t-time").textContent=fmtT(left);
  $("#t-prog").style.transform=`scaleX(${Math.max(0,left)/T.total})`;
  if(left<=0){$("#timer").classList.add("over");if(!T.beeped){T.beeped=true;beep()}}
}
function stopTimer(){clearInterval(T.iv);$("#timer").hidden=true;try{T.lock&&T.lock.release()}catch(e){}T.lock=null}

  if(d.wrist!=null&&t.closest(".checkin")){const k=S.sel;mutate(k,e=>{e.wrist=String(e.wrist)===d.wrist?null:d.wrist;if(e.wrist==null)delete e.wrist});saveDay(k);render();return}
  if(d.plates){S.platesOpen[d.plates]=!S.platesOpen[d.plates];render();return}
  if(d.addset){const k=S.sel;mutate(k,e=>{e.log=e.log||{};const s=getSets(e.log[d.addset]).slice();const x=EXBY[d.addset],b=blockInfo(k);const n=Math.max(s.length,b&&b.deload?Math.ceil(x.sets/2):x.sets);while(s.length<n)s.push({w:"",r:"",d:false});s.push({w:"",r:"",d:false});e.log[d.addset]={sets:s}});saveDay(k);render();return}
  if(d.check){const k=S.sel,id=d.check,i=+d.i;let nowDone=false,pr=0;
    mutate(k,e=>{e.log=e.log||{};const s=getSets(e.log[id]).map(z=>({...z}));while(s.length<=i)s.push({w:"",r:"",d:false});const c=s[i];
      if(!c.d){if(!c.w)c.w=d.phW||"";if(!c.r)c.r=d.phR||"";c.d=!!(num(c.w)!=null&&num(c.r));nowDone=c.d;if(nowDone){const b=bestBefore(id,k);if(b&&e1rm(c.w,c.r)>b)pr=e1rm(c.w,c.r)}if(!e.start)e.start=new Date().toISOString()}else c.d=false;
      e.log[id]={sets:s}});
    saveDay(k);render();
    if(nowDone){const x=EXBY[id];startTimer(x.rest,x.n);if(pr)toast(`שיא חדש! e1RM ${pr} ק״ג`)} else if(!getSets((entry(k).log||{})[id])[i].d&&!getSets((entry(k).log||{})[id])[i].w) toast("רשום משקל וחזרות לפני סימון");
    return}
  if(d.export){exportCsv();return}
  if(d.ics){icsMonth();return}
  if(d.backup){backupJson();return}
  if(d.restore){const f=$("#restoreFile");if(f){f.value="";f.click()}return}
  if(d.restorecancel){S.pendingRestore=null;render();return}
  if(d.restoreok){if(S.pendingRestore&&db&&db._replace){db._replace(S.pendingRestore.data);S.pendingRestore=null;toast("הנתונים שוחזרו")}render();return}
  if(d.syncmonth){syncDays(monthKeys(true));return}
  if(d.syncday){syncDays([d.syncday]);return}
  if(d.savegc){const tm=$("#gcTime").value||"18:00",du=Math.min(180,Math.max(30,parseInt($("#gcDur").value)||75));S.settings={...S.settings,gcTime:tm,gcDur:du,gcAuto:$("#gcAuto").checked};saveSettings();render();toast("ההגדרות נשמרו");return}
  if(d.saveblock){const v=$("#blockStart").value;if(!v)return;S.settings={...S.settings,blockStart:v};render();saveSettings();return}
});
document.addEventListener("input",ev=>{
  const el=ev.target;
  if(el.dataset.log){const k=S.sel,id=el.dataset.log,f=el.dataset.f;mutate(k,e=>{e.log=e.log||{};e.log[id]={...(e.log[id]||{}),[f]:el.value.trim()};if(!e.log[id].w&&!e.log[id].r)delete e.log[id]});saveLater(k)}
  if(el.dataset.note){const k=el.dataset.note;mutate(k,e=>{e.note=el.value});saveLater(k)}
  if(el.dataset.set){const k=S.sel,id=el.dataset.set,i=+el.dataset.i,f=el.dataset.f;mutate(k,e=>{e.log=e.log||{};const s=getSets(e.log[id]).map(z=>({...z}));while(s.length<=i)s.push({w:"",r:"",d:false});s[i][f]=el.value.trim();e.log[id]={sets:s}});saveLater(k)}
  if(el.dataset.bw){const k=el.dataset.bw;mutate(k,e=>{if(el.value.trim())e.bw=el.value.trim();else delete e.bw});saveLater(k)}
});
setInterval(()=>{const el=document.getElementById("elapsed"),e=entry(S.sel);if(el&&e&&e.start)el.textContent="⏱ "+elapsedTxt(e.start)},30000);
document.addEventListener("change",ev=>{
  const el=ev.target;
  if(el.dataset.time){const k=el.dataset.time;mutate(k,e=>{if(el.value)e.time=el.value;else delete e.time});saveDay(k)}
  if(el.id==="gcAuto"){S.settings={...S.settings,gcAuto:el.checked};saveSettings()}
  if(el.id==="progEx"){S.progEx=el.value;el.blur();render()}
  if(el.id==="restoreFile"&&el.files&&el.files[0]){readRestoreFile(el.files[0])}
  const tm=el.id&&el.id.match(/^tpl-[wt]-(\d)$/);
  if(tm){const i=+tm[1];S.tplDraft=S.tplDraft||{};S.tplDraft[i]={w:$("#tpl-w-"+i).value,t:$("#tpl-t-"+i).value}}
});
/* A render replaces the DOM, so it must never land between pointerdown and click (the tap would be lost). */
let pointerDown=false;
const editing=()=>document.activeElement&&document.activeElement.matches("#app input:not([type=checkbox]),#app textarea,#app select,#sheet input");
function flushRender(){setTimeout(()=>{if(pendingRender&&!pointerDown&&!editing())render()},0)}
document.addEventListener("pointerdown",()=>{pointerDown=true},true);
document.addEventListener("pointerup",()=>{setTimeout(()=>{pointerDown=false;flushRender()},50)},true);
document.addEventListener("pointercancel",()=>{pointerDown=false;flushRender()},true);
document.addEventListener("focusout",flushRender);
document.addEventListener("toggle",ev=>{if(ev.target&&ev.target.id==="tplBox")S.tplOpen=ev.target.open},true);
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&S.sheetKey)closeSheet()});

/* ---------- boot ---------- */
render();
// after midnight (or when coming back to the app the next day) jump to the new today
let bootDay=todayKey();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&todayKey()!==bootDay){const old=bootDay;bootDay=todayKey();if(S.sel===old)S.sel=bootDay;if(S.month===old.slice(0,7))S.month=bootDay.slice(0,7);render()}});
async function boot(){
  const timer=setTimeout(()=>{if(!live)setStatus("הנתונים עוד לא נטענו",true)},10000);
  try{ if(window.claude&&window.claude.use) db=await window.claude.use("db") }catch(e){db=null}
  if(!db){clearTimeout(timer);setStatus("לא מחובר: שינויים לא יישמרו",true);return}
  try{const user=await window.claude.use("user");if(user)canWrite=await user.isOwner()}catch(e){}
  if(!canWrite) setStatus("צפייה בלבד",true);
  db.collection("days").onSnapshot(snap=>{
    // keep local edits that have not reached the store yet
    const keep=new Map();for(const k of dirty)keep.set(k,S.days.get(k));for(const k in writing)if(writing[k])keep.set(k,S.days.get(k));
    S.days.clear();snap.docs.forEach(d=>{if(d.exists)S.days.set(d.id,d.data())});
    for(const [k,v] of keep){if(v)S.days.set(k,v);else S.days.delete(k)}
    if(!snap.metadata.fromCache){live=true;clearTimeout(timer);if(canWrite)setStatus(STANDALONE?"שמור בטלפון ✓":"מסונכרן ✓")}
    render();
  },()=>{clearTimeout(timer);setStatus("אין גישה לנתונים",true)});
  if(STANDALONE&&!lsGet("drorwhey:seeded")){ // first launch on this phone: schedule this month and next from the template
    setTimeout(async()=>{if(S.days.size)return lsSet("drorwhey:seeded","1");const t=todayKey(),ks=[];
      for(let i=0;i<62;i++){const k=addDays(t,i),tp=tplFor(parseKey(k).getDay());if(tp){mutate(k,e=>{e.workout=tp.w;e.done=false;if(tp.t)e.time=tp.t});ks.push(k)}}
      lsSet("drorwhey:seeded","1");render();for(const k of ks)await saveDay(k);toast("האימונים לחודשיים הקרובים שובצו לפי התבנית")},300);
  }
  db.doc("settings/main").onSnapshot(s=>{if(s.exists){S.settings={...S.settings,...s.data()};render()}},()=>{});
  db.doc("gcal/index").onSnapshot(s=>{if(s.exists&&!S.gcBusy){S.gcal={...(s.data().events||{})};render()}},()=>{});
}
boot();
</script>
